services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: widget_platform
      POSTGRES_USER: widget_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
    - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget_app -d widget_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
